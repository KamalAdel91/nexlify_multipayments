[project]
name = "multi_payment"
authors = [{ name = "Kamal Adel", email = "Kamal.adel@outlook.com" }]
description = "Multi-Expense / Multi-Revenue lines on Payment Entry (no party required)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
